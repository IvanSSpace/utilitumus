# Тег v* → сборка .app на macOS и релиз с Utilitumus.zip.
# Приложение само находит последний релиз (Sources/App/Updater.swift).
#   git tag v0.3.0 && git push origin v0.3.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Версия из тега
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Info.plist

      - name: Сборка
        run: NO_INSTALL=1 ./build.sh

      - name: Архив
        run: ditto -c -k --keepParent build/Utilitumus.app Utilitumus.zip

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Utilitumus.zip --title "Utilitumus $GITHUB_REF_NAME" --generate-notes
