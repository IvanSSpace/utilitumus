# Запасной путь релиза — сборка на macOS-раннере GitHub, запускается вручную
# (Actions → Release → Run workflow, тег вида v0.3.0). Основной путь —
# ./scripts/release.sh на своём Mac: без очереди на раннеры.
# Приложение само находит последний релиз (Sources/App/Updater.swift).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Версия из тега
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Info.plist

      # Постоянный сертификат из секретов: та же подпись, что у прошлых версий,
      # иначе у пользователей после обновления слетают разрешения macOS.
      - name: Сертификат подписи
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ]; then echo "Секрета нет — будет ad-hoc"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Сборка
        run: NO_INSTALL=1 ./build.sh

      - name: Архив
        run: ditto -c -k --keepParent build/Utilitumus.app Utilitumus.zip

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" Utilitumus.zip --title "Utilitumus $TAG" --generate-notes
